version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: school_db
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  school-backend:
    build: .
    container_name: school-backend
    ports:
      - "8081:8080"
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: school_db
      DB_USERNAME: root
      DB_PASSWORD: root123
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data: