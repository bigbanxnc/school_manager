spring.application.name=school-manager
# Server Configuration
server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:mysql://localhost:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%-5level : %m%n

# tên file
logging.file.name=logs/school-manager.log
# cấu hình
logging.level.root=INFO
logging.level.com.school.manager=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

